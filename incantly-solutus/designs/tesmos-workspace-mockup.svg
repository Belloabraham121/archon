<g font-family="Arial"><rect x="54" y="198" width="342" height="94" rx="14" fill="#192d4d" stroke="#3a557f"/><text x="76" y="229" fill="#8ca4cb" font-size="13">1</text><text x="109" y="232" fill="#f7f9ff" font-family="Georgia" font-size="27">v₀ = 20</text><path d="M110 259h230" stroke="#6079a7" stroke-width="5" stroke-linecap="round"/><circle cx="203" cy="259" r="10" fill="#f59e45"/><rect x="54" y="308" width="342" height="94" rx="14" fill="#192d4d" stroke="#3a557f"/><text x="76" y="339" fill="#8ca4cb" font-size="13">2</text><text x="109" y="342" fill="#f7f9ff" font-family="Georgia" font-size="27">θ = 45°</text><path d="M110 369h230" stroke="#6079a7" stroke-width="5" stroke-linecap="round"/><circle cx="226" cy="369" r="10" fill="#f59e45"/><rect x="54" y="418" width="342" height="70" rx="14" fill="#192d4d" stroke="#3a557f"/><text x="76" y="459" fill="#8ca4cb" font-size="13">3</text><text x="109" y="462" fill="#f7f9ff" font-family="Georgia" font-size="23">g = 9.81</text><rect x="54" y="504" width="342" height="98" rx="14" fill="#192d4d" stroke="#3a557f"/><text x="76" y="537" fill="#8ca4cb" font-size="13">4</text><text x="109" y="540" fill="#f7f9ff" font-family="Georgia" font-size="20">P(t) = (x(t), y(t))</text><text x="109" y="572" fill="#c7d8f4" font-family="Georgia" font-size="16">{ 0 ≤ t ≤ 2v₀sin(θ)/g }</text><rect x="54" y="630" width="342" height="44" rx="12" fill="#28436a"/><text x="77" y="658" fill="#e4efff" font-size="15">＋ Add expression</text></g>
<rect x="446" y="128" width="756" height="540" rx="18" fill="#0e1b31" stroke="#37547f"/><rect x="446" y="128" width="756" height="540" rx="18" fill="url(#g)"/><path d="M508 588h645M508 158v450" stroke="#a7bddf" stroke-width="2"/><text x="1130" y="578" fill="#a7bddf" font-family="Arial" font-size="16">x</text><text x="520" y="178" fill="#a7bddf" font-family="Arial" font-size="16">y</text><path d="M508 588C575 433 649 310 724 245C810 170 890 211 964 315C1026 408 1085 495 1149 566" fill="none" stroke="#67b7ff" stroke-width="7"/><path d="M508 588C575 433 649 310 724 245C810 170 890 211 964 315C1026 408 1085 495 1149 566V588Z" fill="#67b7ff" opacity=".2"/><circle cx="964" cy="315" r="12" fill="#f59e45" stroke="#ffe2c4" stroke-width="4"/><rect x="986" y="205" width="166" height="40" rx="12" fill="#203959"/><text x="1001" y="230" fill="#f4f8ff" font-family="Arial" font-size="14">P(2.27) = (32.1, 8.9)</text>
<rect x="446" y="692" width="756" height="256" rx="18" fill="#172b4c" stroke="#37547f"/><text x="478" y="733" fill="#f7f9ff" font-family="Arial" font-size="17" font-weight="700">Explore the model</text><text x="478" y="762" fill="#b3c5e1" font-family="Arial" font-size="15">How does decreasing gravity affect the range and peak height?</text><rect x="478" y="790" width="680" height="118" rx="13" fill="#0d1a2e" stroke="#37547f"/><text x="504" y="824" fill="#91aad1" font-family="Arial" font-size="13">JEV NOTE</text><text x="504" y="855" fill="#dce8fb" font-family="Arial" font-size="15">Try g = 1.62 to model the Moon. Both views update from this one model.</text>
